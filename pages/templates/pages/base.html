<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}個人課表{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .timetable th, .timetable td { vertical-align: middle; }
    .timetable .period-col { width: 8rem; }
    .timetable td.course { background: #e7f1ff; position: relative; }
    .timetable td.clickable { cursor: pointer; }
    .timetable td.clickable:hover { background: #cfe2ff; }
    /* 課程內容浮在格子上、不佔版面，加入課程後表格大小不變 */
    .timetable .course-content {
      position: absolute; inset: 0; padding: .25rem .4rem;
      display: flex; flex-direction: column; justify-content: center; gap: .25rem;
      font-size: .8rem; line-height: 1.2; overflow: hidden;
    }
    .timetable .course-content > div {
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    @media print {
      @page { size: A4 landscape; margin: 10mm; }
      body { background: #fff !important; }
      .navbar, .no-print, .alert { display: none !important; }
      main.container { max-width: none; padding: 0; }
      .timetable { font-size: 11pt; margin: 0; }
      .timetable th, .timetable td { padding: .3rem; }
      .timetable .course-content { font-size: 8.5pt; padding: .15rem .3rem; }
      .timetable td.course {
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
    }
  </style>
</head>
<body class="bg-light">
  <nav class="navbar navbar-dark bg-primary mb-4">
    <div class="container">
      <a class="navbar-brand" href="{% url 'timetable' %}">個人課表</a>
    </div>
  </nav>
  <main class="container pb-5">
    {% for message in messages %}
      <div class="alert alert-success alert-dismissible fade show" role="alert">
        {{ message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="關閉"></button>
      </div>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
